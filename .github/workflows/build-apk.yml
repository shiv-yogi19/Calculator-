name: Build Online APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.9'

    - name: Auto-Fix Permissions & Build Debug APK
      run: |
        # 1. Target directory check (root vs subfolder)
        TARGET_DIR="."
        if [ -d "android-project" ] && [ ! -f "build.gradle.kts" ]; then
          echo "Switching to android-project folder..."
          TARGET_DIR="android-project"
        fi
        cd "$TARGET_DIR"

        # 2. Accept Android SDK licenses
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

        # 3. Generate wrapper if missing
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.9
        fi
        chmod +x gradlew

        # 4. Clean and Build APK with detailed diagnostics
        ./gradlew assembleDebug --no-daemon --stacktrace --info

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: NEXCAL-APK
        path: |
          app/build/outputs/apk/debug/*.apk
          android-project/app/build/outputs/apk/debug/*.apk
