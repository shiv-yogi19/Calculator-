name: Build Online APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle Build Environment
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        # 1. Check if files are inside android-project folder
        if [ -d "android-project" ] && [ ! -f "build.gradle.kts" ]; then
          echo "Moving into android-project directory..."
          cd android-project
        fi

        # 2. If gradlew is missing, generate it automatically
        if [ ! -f "gradlew" ]; then
          echo "gradlew not found. Generating wrapper..."
          gradle wrapper
        fi

        # 3. Give execution permission and build
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NEXCAL-APK
        path: |
          app/build/outputs/apk/debug/*.apk
          android-project/app/build/outputs/apk/debug/*.apk
