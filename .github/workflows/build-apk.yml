name: Build Online APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.9'

    - name: Build Debug APK
      run: |
        # 1. यदि प्रोजेक्ट सब-फोल्डर में हो तो सही डायरेक्टरी में जाएँ
        TARGET_DIR="."
        if [ -d "android-project" ] && [ ! -f "build.gradle.kts" ]; then
          TARGET_DIR="android-project"
        fi
        cd "$TARGET_DIR"

        # 2. इनबिल्ट Android SDK के लाइसेंस स्वीकार करें
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

        # 3. gradlew मिसिंग होने पर जनरेट करें
        if [ ! -f "gradlew" ]; then
          gradle wrapper --gradle-version 8.9
        fi
        chmod +x gradlew

        # 4. APK संकलित (Compile) करें
        ./gradlew assembleDebug --no-daemon

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: NEXCAL-APK
        path: |
          app/build/outputs/apk/debug/*.apk
          android-project/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
