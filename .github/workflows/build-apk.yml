name: Build Online APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 2. Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.9'

    - name: 4. Auto-Fix Code & Build APK
      run: |
        set -e
        echo "=== STEP A: Locating Android Project Root ==="
        TARGET_DIR="."
        if [ -d "android-project" ] && [ ! -f "build.gradle.kts" ]; then
          TARGET_DIR="android-project"
        fi
        cd "$TARGET_DIR"
        echo "Working inside: $(pwd)"

        echo "=== STEP B: Accept Android Licenses ==="
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

        echo "=== STEP C: Auto-Patching Kotlin Syntax & Resources ==="
        # Fix potential string/operator gaps in MainCalculatorScreen.kt if present
        SCREEN_FILE=$(find . -name "MainCalculatorScreen.kt" | head -n 1)
        if [ -f "$SCREEN_FILE" ]; then
          echo "Patching $SCREEN_FILE..."
          sed -i 's/expression += ""/expression += " "/g' "$SCREEN_FILE" || true
          sed -i 's/expression += " "/expression += " "/g' "$SCREEN_FILE" || true
        fi

        # Fix color alpha syntax if needed in Color.kt
        COLOR_FILE=$(find . -name "Color.kt" | head -n 1)
        if [ -f "$COLOR_FILE" ]; then
          echo "Patching $COLOR_FILE..."
          sed -i 's/0x33FFFFFF/0x33FFFFFFL/g' "$COLOR_FILE" || true
        fi

        echo "=== STEP D: Generate Clean Gradle Wrapper ==="
        gradle wrapper --gradle-version 8.9 --distribution-type bin
        chmod +x gradlew

        echo "=== STEP E: Executing Full AssembleDebug Build ==="
        ./gradlew clean --no-daemon
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: 5. Upload Generated APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: NEXCAL-APK
        path: |
          **/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
